name: lint

# Styling + hygiene gate. Runs the same hooks as a local `pre-commit install`.
#
# macOS rather than Linux, which is where the sibling repos lint: the
# swift-format hook shells out to `xcrun swift-format` from the Xcode toolchain,
# and there is no Swift toolchain on a Linux hook runner. Since this repo is
# macOS-only anyway (it cross-compiles for iOS), one macOS runner covers
# everything rather than splitting hooks across two jobs.
#
# Invoked by ci.yml, which owns the push / pull_request triggers and the
# concurrency group.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # Pinned, and here it decides the gate's behavior rather than just the
    # build's: the swift-format hook is whatever `xcrun` finds in the image's
    # Xcode, so an image rollover under macos-latest can reformat Swift and fail
    # a PR that touched no Swift at all. Pinning removes the rollover; it cannot
    # remove Xcode updates within the image, which is why the version is still
    # printed below -- a drift shows up in the log rather than as a mystery.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Cache pre-commit's installed hook environments (incl. the pinned
      # clang-format) keyed on the config so they're only rebuilt when it
      # changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          # Reuse unchanged hook envs across config edits (e.g. a rev bump)
          # instead of rebuilding every environment from cold.
          restore-keys: |
            pre-commit-${{ runner.os }}-
      # Pin the runner so a new upstream pre-commit release cannot change the
      # merge gate's behavior without a commit here.
      - run: python -m pip install pre-commit==4.6.1
      - name: Report the swift-format in use
        run: xcrun swift-format --version
      - run: pre-commit run --all-files --show-diff-on-failure

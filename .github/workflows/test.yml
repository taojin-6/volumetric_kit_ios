name: test

# The host tests for vi_core -- the scanner's pure logic --, vi_session, the
# session writer, and vi_stream, the stream sender.
#
# This is the only job in this repo that *runs* anything. The app targets are
# build-only by nature: MoltenVK ships no simulator slice and ARKit scene depth
# needs LiDAR, so nothing that touches ARKit's camera can execute anywhere but
# a real device. vi_core is the part that carries no such dependency, and it is
# deliberately the part that decides things -- a sign, a threshold, whether a
# kernel reading is trustworthy -- so it is where a test earns the most.
# vi_session is host code on sensor's and grid's public types; vi_stream's
# tests run sensor's ARKit test pattern (no camera) on this Mac's GPU and
# VideoToolbox.
#
# It configures with -DVI_HOST_TESTS=ON, which builds vi_core, vi_session,
# vi_stream and the tests, and of the siblings only the tiers they link: the
# core and its test fixtures, sensor's interface, wire form, ARKit driver,
# encoder, decoder and frame prep, grid's .vrst container and server. No
# recon, gfx, MoltenVK release or Xcode project. That is why this leg is
# minutes rather than the build leg's tens. The link's tests dial 127.0.0.1
# only.
#
# Invoked by ci.yml, which owns the triggers and the concurrency group.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # The family's self-hosted Mac (label `mac`), as sensor's and recon's Mac
    # legs: sensor's interface reaches the Vulkan headers through its frame
    # tier, so the host build needs the Vulkan SDK, which that Mac has from
    # Homebrew, and the iPad's encoder tests to come need its VideoToolbox
    # hardware. The core's tools/runners/setup-runners.sh registers its runners.
    runs-on: [self-hosted, mac]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Homebrew formulae the host build finds: glm and the Vulkan SDK
      # (headers, loader, MoltenVK as its driver), and glslc, which sensor's
      # configure looks for. Checked, not installed: the runner's owner
      # installs and upgrades them.
      - name: Check dependencies
        run: |
          # Without brew every formula would look missing.
          command -v brew >/dev/null || {
            echo "::error::brew is not on this runner's PATH"
            exit 1
          }
          missing=""
          for pkg in cmake glm molten-vk vulkan-headers vulkan-loader shaderc; do
            brew list --formula "$pkg" >/dev/null 2>&1 || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing Homebrew formulae:$missing"
            exit 1
          fi

      # No dependency cache: the siblings' object files would outlive a
      # Homebrew upgrade of the headers they were built against, and the
      # fetch is a few clones on a self-hosted runner.
      - name: Configure
        run: cmake -S . -B build-host -DVI_HOST_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-host --parallel 4

      # --output-on-failure so a red run carries the assertion in the log rather
      # than only the case name. This Mac has a GPU and VideoToolbox's HEVC
      # encoder and decoder, so the stream sender's tests fail rather than
      # skip without them, as sensor's Mac leg runs its own.
      - name: Test
        env:
          VKC_REQUIRE_VULKAN_DEVICE: '1'
          VS_TEST_HEVC_BACKEND: videotoolbox
          VS_TEST_HEVC_ENCODER: videotoolbox
        run: ctest --test-dir build-host --output-on-failure --parallel 4

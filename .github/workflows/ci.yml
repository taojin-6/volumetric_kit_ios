name: ci

# Umbrella CI. The iOS build and lint fan out from here, and the single
# `required` gate at the bottom succeeds only if both did. Branch protection
# requires just that one check ("ci / required"), so the protected `main`
# required-checks list stays stable as legs are added or renamed -- adding a job
# never silently leaves an old required context unreported and blocking every
# PR. Same shape as volumetric_kit_recon's and volumetric_kit_gfx's CI.
#
# No scheduled trigger: nothing changes between commits here. CMakeLists.txt
# pins volumetric_kit_recon and volumetric_kit_gfx by commit, so an upstream
# change reaches this build only through a PR that bumps a pin -- adopted
# deliberately, with a change in hand to fix it against. (They used to track
# `main`, and a nightly then reported upstream drift as a red `main` on mornings
# with no work queued against it.)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here reads private data or writes back to the repo.
# Explicit because this repo is public, so the default token grant is worth
# stating rather than inheriting.
permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the ref: a manual dispatch and a push to main
  # both resolve to refs/heads/main, and without the event they would share a
  # group and cancel each other.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  required:
    # The single status check branch protection requires. It passes only when
    # every leg succeeded, and FAILS (never skips) on any other outcome: a
    # skipped required check never reports its result and would block every
    # merge forever.
    needs: [build, lint, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        run: |
          echo "build=${{ needs.build.result }}" \
               "lint=${{ needs.lint.result }}" \
               "test=${{ needs.test.result }}"
          if [ "${{ needs.build.result }}" = success ] \
             && [ "${{ needs.lint.result }}" = success ] \
             && [ "${{ needs.test.result }}" = success ]; then
            echo "All required CI jobs passed."
          else
            echo "::error::one or more required CI jobs did not succeed (see results above)"
            exit 1
          fi

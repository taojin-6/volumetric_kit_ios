name: build

# Cross-compiles every app target for iOS arm64 (device), in Release, as the
# apps ship.
#
# Build-only, by nature: MoltenVK ships no simulator slice and ARKit scene depth
# needs LiDAR, so there is no runnable iOS target in CI. That is still worth
# gating on -- the breakages this catches are exactly the ones that bit while
# standing the repo up: a sibling change that stops Xcode-generating, a toolchain
# regression, a Swift/Objective-C++ seam that no longer compiles.
#
# Unsigned: CODE_SIGNING_ALLOWED=NO means no Apple Development certificate or
# provisioning profile is needed, so CI needs no secrets. Signing is only
# required to install on hardware, which a human does.
#
# Invoked by ci.yml, which owns the triggers and the concurrency group.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # The family's self-hosted Mac (label `mac`), as the test leg. Its runners
    # name MoltenVK's iOS release, installed once on that Mac, in MoltenVK_ROOT
    # (the core's tools/runners/README.md, "Macs", step 5). Xcode, glslc and glm
    # are the runner's too, which its owner installs and upgrades; the configure
    # refuses a missing one with the core's own message.
    runs-on: [self-hosted, mac]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache, as the test leg: the siblings' object files would
      # outlive an Xcode or Homebrew upgrade of what built them, and the fetch
      # is a few clones on a self-hosted runner.
      - name: Configure
        run: cmake --preset ios

      # The `ios` build preset: Release. No VI_DEVELOPMENT_TEAM is passed, so
      # CMake warns that the bundles cannot be installed on hardware --
      # expected and correct for a build-only gate.
      - name: Build (unsigned)
        run: |
          cmake --build --preset ios -- \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      # A bundle that builds but is not actually an iOS arm64 binary would
      # otherwise pass silently -- the exact failure mode a host-vs-target mixup
      # produces. platform 2 is iOS (1 would be macOS).
      - name: Assert the binaries are iOS arm64
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for app in build-ios/apps/*/Release-iphoneos/*.app; do
            bin="${app}/$(basename "${app}" .app)"
            echo "--- ${bin}"
            lipo -info "${bin}"
            if ! otool -l "${bin}" | grep -A3 LC_BUILD_VERSION | grep -q "platform 2"; then
              echo "::error::${bin} is not built for iOS (expected LC_BUILD_VERSION platform 2)"
              exit 1
            fi
            found=$((found + 1))
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::no .app bundles were produced"
            exit 1
          fi
          echo "${found} app bundle(s) verified as iOS arm64."

      - name: Verify the scanner scenario is bundled
        run: |
          cmp apps/scanner/config/scanner.json \
            build-ios/apps/scanner/Release-iphoneos/scanner.app/scanner.json
